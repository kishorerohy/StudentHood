<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Set up your profile | StudentHood</title>
  <meta name="robots" content="noindex,nofollow">
  <link rel="icon" type="image/png" sizes="64x64" href="assets/studenthood-tab-v3-64.png">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="onboarding.css?v=20261004-1">
</head>
<body class="onboarding-body">
  <main class="onboarding-shell">
    <section class="onboarding-card" aria-labelledby="onboarding-title">
      <a class="onboarding-logo" href="index.html" aria-label="StudentHood home">
        <img src="assets/studenthood-logo.png" alt="StudentHood">
      </a>

      <div id="onboardingFormView">
        <div class="onboarding-progress"><span></span></div>
        <div class="eyebrow">YOUR STUDENTHOOD</div>
        <h1 id="onboarding-title">Set up your profile</h1>
        <p class="onboarding-intro">A few details now. You can change them later.</p>

        <form id="profileForm" class="onboarding-form">
          <label>
            <span>Full name</span>
            <input id="fullName" name="fullName" required maxlength="100" autocomplete="name" placeholder="Your name">
          </label>

          <label>
            <span>Username</span>
            <div class="username-wrap">
              <span>@</span>
              <input id="username" name="username" required minlength="3" maxlength="24" pattern="[a-z0-9_]{3,24}" autocapitalize="none" autocomplete="username" placeholder="yourname">
            </div>
            <small>3 to 24 characters. Lowercase letters, numbers and underscores only.</small>
          </label>

          <label>
            <span>Date of birth</span>
            <input id="dateOfBirth" name="dateOfBirth" required type="date" autocomplete="bday">
            <small>Used for age eligibility and safety. Your full date of birth is private and will not appear on your profile. Under-18 accounts use teen safety mode and pause at 7:00 PM local time.</small>
          </label>

          <label>
            <span>Country or region</span>
            <select id="countryCode" name="countryCode" required>
              <option value="">Select your country or region</option>
            </select>
            <small>We use this only to apply the correct age, safety and legal protections.</small>
          </label>

          <label>
            <span>Time zone</span>
            <input id="timeZoneDisplay" type="text" readonly aria-describedby="timeZoneHelp">
            <input id="timeZone" name="timeZone" type="hidden">
            <small id="timeZoneHelp">Detected from this device for under-18 quiet hours. It is locked after setup to prevent bypassing the limit.</small>
          </label>

          <label>
            <span>City</span>
            <input id="city" name="city" maxlength="80" autocomplete="address-level2" placeholder="Where are you based?">
          </label>

          <label>
            <span>Campus or institution</span>
            <input id="campusName" name="campusName" required maxlength="160" autocomplete="organization" placeholder="Your university or campus">
            <small>This helps StudentHood show campus-relevant Scenes, Hangs, Crews and Gigs.</small>
          </label>

          <label>
            <span>Bio</span>
            <textarea id="bio" name="bio" maxlength="280" rows="4" placeholder="A little about you"></textarea>
            <small><span id="bioCount">0</span>/280</small>
          </label>

          <label>
            <span>Interests</span>
            <input id="interests" name="interests" placeholder="Photography, football, coding, food">
            <small>Add up to 12 interests, separated by commas.</small>
          </label>

          <p id="profileStatus" class="onboarding-status" aria-live="polite"></p>

          <button id="saveProfileBtn" class="btn primary full onboarding-submit" type="submit">
            <span>Finish profile</span><span aria-hidden="true">→</span>
          </button>
        </form>
      </div>

      <div id="onboardingDoneView" class="onboarding-done" hidden>
        <div class="done-mark">✓</div>
        <div class="eyebrow">PROFILE READY</div>
        <h1>You’re in.</h1>
        <p id="doneCopy">Your StudentHood profile is ready.</p>
        <a class="btn primary full onboarding-submit" href="app.html">Enter StudentHood</a>
      </div>
    </section>
  </main>

  <script type="module" src="onboarding.js?v=20261005-youth-1"></script>
</body>
</html>
