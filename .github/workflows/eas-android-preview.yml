name: StudentHood Expo EAS Android Preview

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mobile/app.json'

permissions:
  contents: read

concurrency:
  group: studenthood-eas-android-preview
  cancel-in-progress: false

jobs:
  request-expo-apk:
    name: Build and verify APK on Expo EAS
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Check Expo access token
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::EXPO_TOKEN is missing. Create a token at https://expo.dev/settings/access-tokens and add it as an Actions repository secret: https://github.com/kishorerohy/StudentHood/settings/secrets/actions"
            exit 1
          fi
          echo "Expo token is configured; keeping its value secret."

      - name: Set up Expo EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: 24.11.0
          token: ${{ secrets.EXPO_TOKEN }}
          packager: npm

      - name: Install application dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate Expo dependencies
        run: npx expo-doctor@latest

      - name: Test EAS build verification
        run: node --test scripts/verify-eas-build.test.cjs

      - name: Build Android APK on Expo EAS and wait for completion
        run: eas build --platform android --profile preview --non-interactive --freeze-credentials --wait --json > eas-build.json

      - name: Verify completed Expo APK
        run: node scripts/verify-eas-build.cjs eas-build.json
