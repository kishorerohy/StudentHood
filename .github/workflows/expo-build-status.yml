name: StudentHood Expo APK Readout

# Read-only status of the owner-approved submitted v0.1.9 EAS build; never queues another APK.
# This workflow never invokes "eas build" and cannot queue another APK.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/expo-build-status.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-approved-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout StudentHood
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Confirm protected Expo access
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          test -n "$EXPO_TOKEN" || { echo "::error::Protected Expo token not available"; exit 1; }

      - name: Read existing Expo EAS build (no new APK request)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          CI: '1'
        run: |
          npx --yes eas-cli@latest build:list --platform android --limit 10 --json --non-interactive > "$RUNNER_TEMP/studenthood-eas-status.json"
          node -e '
            const fs=require("fs");
            const all=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+"/studenthood-eas-status.json","utf8"));
            const p=(Array.isArray(all)?all:(Array.isArray(all.builds)?all.builds:[])).find(b=>b.id==="d33d26bc-eec8-4306-adc5-8216f99a166c")||{};
            const status=String(p.status||"NOT_RETURNED_BY_EAS");
            const url="https://expo.dev/accounts/studenthood-0920/projects/studenthood/builds/d33d26bc-eec8-4306-adc5-8216f99a166c";
            const artifact=p.artifacts?.buildUrl||p.artifacts?.applicationArchiveUrl||p.artifacts?.androidBuildUrl||"";
            const lines=[
              "# StudentHood v0.1.9 Android EAS build",
              "",
              "**Expo status:** "+status,
              "",
              "**Build details:** "+url,
              "",
              "**APK artifact:** "+(artifact||"Not yet available"),
              "",
              "Read-only build:list check; no new APK was requested."
            ];
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,lines.join("\n")+"\n");
            console.log("Existing v0.1.9 EAS status: "+status);
            console.log("Expo build details: "+url);
            if(artifact)console.log("APK artifact available: "+artifact);
          '
