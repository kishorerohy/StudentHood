name: StudentHood Mobile CI

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - 'assets/**'
      - '.github/workflows/mobile-ci.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bundle-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate light-theme brand wordmark
        working-directory: .
        shell: bash
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image
          src="mobile/assets/studenthood-logo.png"
          out="mobile/assets/studenthood-logo-light.png"
          im=Image.open(src).convert("RGBA")
          px=im.load()
          for y in range(im.height):
              for x in range(im.width):
                  r,g,b,a=px[x,y]
                  if a and r>=225 and g>=225 and b>=225 and max(r,g,b)-min(r,g,b)<=14:
                      px[x,y]=(18,18,18,a)
          im.save(out,optimize=True)
          PY
          git config user.name "studenthood-ci"
          git config user.email "studenthood-ci@users.noreply.github.com"
          git add mobile/assets/studenthood-logo-light.png
          if ! git diff --cached --quiet; then
            git commit -m "Add light theme StudentHood wordmark"
            git push
          fi

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: mobile/package.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Expo Doctor
        run: npx expo-doctor@latest

      - name: Export Android bundle
        run: npx expo export --platform android --output-dir dist
