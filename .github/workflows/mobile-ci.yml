name: StudentHood Mobile CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'mobile/**'
      - 'assets/**'
      - '.github/workflows/mobile-ci.yml'
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - 'assets/**'
      - '.github/workflows/mobile-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: mobile/package.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify single branded startup screen
        run: node scripts/check-single-startup.js

      - name: Verify immediate publishing and profile privacy contract
        run: node scripts/check-report-first-publishing.js

      - name: Verify universal Ping settings, privacy and history contract
        run: node scripts/check-ping-conversation-settings.js

      - name: Verify heading-free live Peeps Pulse strip
        run: node scripts/check-peeps-pulse-row.js

      - name: Verify universal heading-free primary screens
        run: node scripts/check-headerless-primary-pages.js

      - name: Verify Discover search visibility and privacy
        run: node scripts/check-discover-search.js

      - name: Verify Hang date/time button labels
        run: node scripts/check-hang-date-time-buttons.js

      - name: Verify location-only institution picker and global data preservation
        run: node scripts/check-location-only-institutions.js

      - name: Verify live campus feeds and notification sounds
        run: node scripts/check-live-campus-feeds.js

      - name: Verify staged campus experiences and Freshers privacy
        run: node scripts/check-experience-foundation.js

      - name: Expo Doctor
        run: npx expo-doctor@latest

      - name: Validate Android native configuration
        run: npx expo config --type introspect --json > /tmp/studenthood-expo-native-config.json

      - name: Verify Android prebuild resources and config plugins
        run: npx expo prebuild --no-install --platform android

      - name: Export Android bundle
        run: npx expo export --platform android --output-dir dist

