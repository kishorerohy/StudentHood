name: StudentHood Mobile CI

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - 'assets/**'
      - '.github/workflows/mobile-ci.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bundle-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: mobile/package.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Capture Expo Doctor report
        shell: bash
        run: |
          mkdir -p ../diagnostics
          set +e
          npx expo-doctor@latest > ../diagnostics/expo-doctor.txt 2>&1
          cat ../diagnostics/expo-doctor.txt
          exit 0

      - name: Publish Expo Doctor report
        working-directory: .
        shell: bash
        run: |
          git config user.name "studenthood-ci"
          git config user.email "studenthood-ci@users.noreply.github.com"
          git add diagnostics/expo-doctor.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Update Expo Doctor diagnostics"
          git push

      - name: Export Android bundle
        run: npx expo export --platform android --output-dir dist
