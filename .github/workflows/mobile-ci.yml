name: StudentHood Mobile CI

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - 'assets/**'
      - '.github/workflows/mobile-ci.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bundle-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate compact app icon
        working-directory: .
        shell: bash
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image
          src="mobile/assets/studenthood-app-icon-1024.png"
          out="mobile/assets/studenthood-app-icon-compact-1024.png"
          im=Image.open(src).convert("RGBA")
          scale=0.78
          size=round(1024*scale)
          resized=im.resize((size,size),Image.Resampling.LANCZOS)
          canvas=Image.new("RGBA",(1024,1024),(11,13,15,255))
          offset=((1024-size)//2,(1024-size)//2)
          canvas.alpha_composite(resized,offset)
          canvas.convert("RGB").save(out,quality=100,optimize=True)
          PY
          git config user.name "studenthood-ci"
          git config user.email "studenthood-ci@users.noreply.github.com"
          git add mobile/assets/studenthood-app-icon-compact-1024.png
          if ! git diff --cached --quiet; then
            git commit -m "Add compact StudentHood app icon"
            git push
          fi

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: mobile/package.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Expo Doctor
        run: npx expo-doctor@latest

      - name: Export Android bundle
        run: npx expo export --platform android --output-dir dist
