plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.studenthood.agesignals'
version = '1.0.0'

android {
  namespace "com.studenthood.agesignals"
  defaultConfig {
    minSdkVersion 23
    versionCode 1
    versionName "1.0.0"
  }
}

dependencies {
  implementation 'com.google.android.play:age-signals:0.0.4'
}
